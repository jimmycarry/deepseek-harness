# The dsh-jsonrpc bundle patch: the SDK runtime JSON-RPC stdio server directly
# over dsh-base. It mounts no Host, HTTP server, Web runtime, or browser
# plugin. stdout is reserved for JSON-RPC frames; the launcher serves stdin
# after the tree is up.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off, as in the headless bundle.
- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
