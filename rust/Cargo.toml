[workspace]
resolver = "2"
members = [
  "vendor/cordis",
  "vendor/loader",
  "crates/util/brand",
  "crates/util/home-paths",
  "crates/util/timeout",
  "crates/util/atomic-write",
  "crates/core/scope",
  "crates/core/session",
  "crates/core/system-prompt",
  "crates/core/tools",
  "crates/core/agent",
  "crates/core/agent-loop",
  "crates/llm/llm",
  "crates/llm/llm-replay",
  "crates/llm/llm-deepseek",
  "crates/llm/token-meter",
  "crates/subprocess/subprocess",
  "crates/subprocess/subprocess-local",
  "crates/sandbox/sandbox",
  "crates/sandbox/sandbox-local",
  "crates/shell/shell",
  "crates/shell/bash-local",
  "crates/shell/bash-sandbox",
  "crates/shell/tool-bash",
  "crates/fs/fs",
  "crates/fs/fs-local",
  "crates/fs/tool-fs",
  "crates/fs/tool-fs-search",
  "crates/fs/tool-str-replace-editor",
  "crates/terminal/terminal",
  "crates/terminal/terminal-local",
  "crates/terminal/tool-terminal",
  "crates/lsp/lsp",
  "crates/lsp/lsp-stdio",
  "crates/lsp/tool-lsp",
  "crates/compaction/compaction",
  "crates/compaction/compaction-basic",
  "crates/compaction/command-compact",
  "crates/compaction/tool-result-pruner",
  "crates/credentials/credentials",
  "crates/credentials/credentials-local",
  "crates/credentials/authorization",
  "crates/skill/skill",
  "crates/skill/skill-filesystem",
  "crates/skill/tool-skill",
  "crates/web/web",
  "crates/web/web-fetch-http",
  "crates/web/tool-web",
  "crates/jobs/jobs",
  "crates/jobs/jobs-local",
  "crates/jobs/tool-jobs",
  "crates/todo/tool-todo",
  "crates/plan/plan-mode",
  "crates/goal/goal",
  "crates/goal/tool-goal",
  "crates/subagent/subagent",
  "crates/subagent/subagent-inprocess",
  "crates/subagent/tool-subagent",
  "crates/workflow/workflow",
  "crates/workflow/workflow-local",
  "crates/workflow/tool-workflow",
  "crates/guard/timeout-policy",
  "crates/session/session-persistence",
  "crates/session/session-persistence-jsonl",
  "crates/session/session-persistence-sqlite",
  "crates/session/session-projection",
  "crates/session/session-query",
  "crates/session/session-storage",
  "crates/session/session-attachment",
  "crates/interaction/commands",
  "crates/sdk/protocol",
  "crates/sdk/client",
  "crates/sdk/server",
  "crates/acp/acp",
  "crates/boot/app-boot",
  "crates/bundle/base",
  "crates/bundle/headless",
  "crates/examples/agent-spine",
  "crates/host/webserver",
  "crates/host/apiproxy",
  "apps/cli",
  "examples/cordis-smoke",
  "tests/snapshots",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.1-rc.2"
rust-version = "1.83"
authors = ["DeepSeek Harness contributors"]

[workspace.dependencies]
async-trait = "=0.1.83"
bytes = "=1.9.0"
futures = "=0.3.31"
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.133"
thiserror = "=1.0.69"
tokio = { version = "=1.42.0", features = ["full"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
tracing = "=0.1.41"

dsh-brand = { path = "crates/util/brand" }
dsh-home-paths = { path = "crates/util/home-paths" }
dsh-timeout = { path = "crates/util/timeout" }
dsh-atomic-write = { path = "crates/util/atomic-write" }
dsh-cordis = { path = "vendor/cordis" }
dsh-cordis-loader = { path = "vendor/loader" }
dsh-scope = { path = "crates/core/scope" }
dsh-session = { path = "crates/core/session" }
dsh-system-prompt = { path = "crates/core/system-prompt" }
dsh-tools = { path = "crates/core/tools" }
dsh-agent = { path = "crates/core/agent" }
dsh-agent-loop = { path = "crates/core/agent-loop" }
